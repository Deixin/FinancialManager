name: Card payments
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: card-payments-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: '1'
jobs:
  card-payments:
    name: US-043 atomic card payments in PostgreSQL and SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node infra/card-payments/run.mjs
        id: protocol
      - name: Remove the owned synthetic environment
        if: always() && steps.protocol.outcome != 'skipped'
        run: node infra/card-payments/clean.mjs
