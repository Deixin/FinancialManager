name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm check

  desktop-vault:
    name: US-001 native vault (Windows)
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Prepare pinned Rust and native Perl
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'C:\Strawberry\perl\bin\perl.exe') {
            Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\Strawberry\perl\bin'
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check --desktop
      - run: pnpm spike:desktop:check
