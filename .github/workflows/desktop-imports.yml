name: Desktop import central and defensive files
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'apps/desktop/**'
      - 'infra/imports-desktop/**'
      - 'infra/import-files-desktop/**'
      - 'infra/import-file-validation/**'
      - 'packages/importers/src/**'
      - '.github/workflows/desktop-imports.yml'
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node infra/imports-desktop/generate.mjs --check
      - run: node infra/imports-desktop/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us050-us051-desktop-browser
          path: .tools/us050-desktop-imports/browser.json
