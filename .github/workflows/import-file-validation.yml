name: Defensive import files and OFX normalization
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: import-file-validation-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: '1'
jobs:
  defensive-files:
    name: US-051 and US-052 synthetic files in Node and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @financial-manager/importers build
      - run: node infra/import-file-validation/run.mjs
