[package]
name = "financial-manager-vault-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "LicenseRef-Proprietary"
default-run = "vault-spike"

[features]
desktop-ui = ["dep:tauri", "dep:tauri-build"]

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
getrandom = "=0.4.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
uuid = { version = "=1.28.0", features = ["v7", "serde"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
rpassword = "=7.5.4"
tauri = { version = "=2.12.3", optional = true, default-features = false, features = ["wry", "compression", "common-controls-v6", "custom-protocol"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[build-dependencies]
tauri-build = { version = "=2.7.2", optional = true }

[[bin]]
name = "vault-spike"
path = "src/main.rs"

[[bin]]
name = "vault-spike-ui"
path = "src/bin/ui.rs"
required-features = ["desktop-ui"]
