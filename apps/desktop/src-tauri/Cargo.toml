[package]
name = "financial-manager-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "LicenseRef-Proprietary"
default-run = "financial-manager"

[features]
entry-smoke = ["tauri/dynamic-acl"]
workspace-smoke = ["tauri/dynamic-acl"]
vault-smoke = ["rusqlite/trace"]
lock-smoke = ["tauri/dynamic-acl", "vault-smoke"]
backup-smoke = ["tauri/dynamic-acl", "vault-smoke"]
restore-smoke = ["backup-smoke"]
manager-smoke = ["workspace-smoke", "vault-smoke"]
accounts-smoke = ["workspace-smoke", "restore-smoke"]
movements-smoke = ["accounts-smoke"]
transfers-smoke = ["movements-smoke"]
card-payments-smoke = ["transfers-smoke"]
categories-smoke = ["accounts-smoke"]
taxonomy-smoke = ["categories-smoke"]

[[bin]]
name = "accounts-probe"
path = "src/bin/accounts-probe.rs"
required-features = ["accounts-smoke"]

[[bin]]
name = "accounts-smoke"
path = "src/bin/accounts-smoke.rs"
required-features = ["accounts-smoke"]

[dependencies]
tauri = { version = "=2.12.3", default-features = false, features = ["wry", "compression", "common-controls-v6", "custom-protocol"] }
serde = { version = "=1.0.229", features = ["derive"], optional = false }
serde_json = "=1.0.154"
unicode-normalization = "=0.1.26"

rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "=0.4.3"
uuid = { version = "=1.28.0", features = ["v7", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
sha2 = "=0.10.9"
argon2 = { version = "=0.6.0", features = ["zeroize"] }
ctutils = "=0.4.3"
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }
windows-future = "=0.3.2"
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[build-dependencies]
tauri-build = "=2.7.2"

[[bin]]
name = "financial-manager"
path = "src/main.rs"

[[bin]]
name = "entry-smoke"
path = "src/bin/entry-smoke.rs"
required-features = ["entry-smoke"]

[[bin]]
name = "workspace-probe"
path = "src/bin/workspace-probe.rs"
required-features = ["workspace-smoke"]

[[bin]]
name = "vault-probe"
path = "src/bin/vault-probe.rs"
required-features = ["vault-smoke"]

[[bin]]
name = "workspace-smoke"
path = "src/bin/workspace-smoke.rs"
required-features = ["workspace-smoke"]

[[bin]]
name = "lock-probe"
path = "src/bin/lock-probe.rs"
required-features = ["lock-smoke"]

[[bin]]
name = "lock-smoke"
path = "src/bin/lock-smoke.rs"
required-features = ["lock-smoke"]

[[bin]]
name = "hello-manual"
path = "src/bin/hello-manual.rs"
required-features = ["lock-smoke"]

[[bin]]
name = "backup-probe"
path = "src/bin/backup-probe.rs"
required-features = ["backup-smoke"]

[[bin]]
name = "backup-smoke"
path = "src/bin/backup-smoke.rs"
required-features = ["backup-smoke"]

[[bin]]
name = "restore-probe"
path = "src/bin/restore-probe.rs"
required-features = ["restore-smoke"]

[[bin]]
name = "restore-smoke"
path = "src/bin/restore-smoke.rs"
required-features = ["restore-smoke"]

[[bin]]
name = "workspace-manager-probe"
path = "src/bin/workspace-manager-probe.rs"
required-features = ["manager-smoke"]

[[bin]]
name = "workspace-manager-smoke"
path = "src/bin/workspace-manager-smoke.rs"
required-features = ["manager-smoke"]

[[bin]]
name = "movements-probe"
path = "src/bin/movements-probe.rs"
required-features = ["movements-smoke"]

[[bin]]
name = "movements-smoke"
path = "src/bin/movements-smoke.rs"
required-features = ["movements-smoke"]

[[bin]]
name="transfers-probe"
path="src/bin/transfers-probe.rs"
required-features=["transfers-smoke"]

[[bin]]
name="transfers-smoke"
path="src/bin/transfers-smoke.rs"
required-features=["transfers-smoke"]

[[bin]]
name="card-payments-probe"
path="src/bin/card-payments-probe.rs"
required-features=["card-payments-smoke"]

[[bin]]
name="card-payments-smoke"
path="src/bin/card-payments-smoke.rs"
required-features=["card-payments-smoke"]

[[bin]]
name="categories-probe"
path="src/bin/categories-probe.rs"
required-features=["categories-smoke"]

[[bin]]
name="categories-smoke"
path="src/bin/categories-smoke.rs"
required-features=["categories-smoke"]

[[bin]]
name="taxonomy-probe"
path="src/bin/taxonomy-probe.rs"
required-features=["taxonomy-smoke"]

[[bin]]
name="classification-filters-smoke"
path="src/bin/classification-filters-smoke.rs"
required-features=["taxonomy-smoke"]

[[bin]]
name="taxonomy-smoke"
path="src/bin/taxonomy-smoke.rs"
required-features=["taxonomy-smoke"]
