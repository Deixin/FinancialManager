services:
  windows:
    image: docker.io/dockurr/windows@sha256:16fd7c39a3e48bb946d29c59dc6015942e5b900a1fa5d7e5552053bfc48ee2ea
    container_name: fm-us001-windows
    environment:
      VERSION: '11'
      USERNAME: US001Test
      CPU_CORES: '4'
      RAM_SIZE: 4G
      DISK_SIZE: 64G
      DISK_FMT: qcow2
      DISK_IO: threads
      DISK_CACHE: writeback
      VERIFY: 'Y'
      LOG: 'N'
    env_file:
      - ${US001_VM_ROOT}/private/guest.env
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 127.0.0.1:18006:8006
    volumes:
      - ${US001_VM_ROOT}/storage:/storage
      - ${US001_VM_ROOT}/oem:/oem:ro
      - ${US001_VM_ROOT}/shared:/shared
    stop_grace_period: 2m
    restart: 'no'
