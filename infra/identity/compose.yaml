name: financial-manager-us023
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: '70:70'
    labels:
      io.financial-manager.us023-synthetic: 'true'
    environment:
      POSTGRES_DB: us023
      POSTGRES_USER: us023_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap-password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      [
        postgres,
        -c,
        log_statement=none,
        -c,
        log_min_error_statement=panic,
        -c,
        log_min_messages=panic,
        -c,
        log_parameter_max_length=0,
        -c,
        log_parameter_max_length_on_error=0,
      ]
    ports: ['127.0.0.1:43223:5432']
    volumes:
      [
        '${US023_ARTIFACTS:?Run identity:test}/bootstrap-password:/run/secrets/bootstrap-password:ro',
      ]
    tmpfs:
      [
        '/var/lib/postgresql:uid=70,gid=70,mode=0700,size=256m',
        '/var/run/postgresql:uid=70,gid=70,mode=0700,size=16m',
      ]
    mem_limit: 512m
    cpus: 2
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [synthetic]
networks:
  synthetic:
